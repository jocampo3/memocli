[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memo-cli"
version = "0.1.0"
description = "A simple CLI tool for managing terminal reminders"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "fuzzyfinder>=2.3.0"
]

[project.scripts]
memo = "memo.cli:cli"

[tool.setuptools.packages.find]
include = ["memo*"]
